<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily 10 Questions</title>
  <style>
    :root{--muted:#afafaf;--text:#3c3c3c;--green:#58cc02;--green-d:#46a302;--blue:#1cb0f6;--red:#ea2b2b;--line:#e5e5e5}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI","Nunito",system-ui,sans-serif;font-weight:600;background:#fff;color:var(--text)}
    .wrap{max-width:720px;margin:0 auto;padding:4px 2px 16px}
    .card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 0 var(--line)}
    h1{margin:0 0 6px;font-size:1.2rem;font-weight:800;color:var(--green)}
    .meta{font-size:.8rem;color:var(--muted);margin:0 0 12px}
    .q{font-size:1.1rem;line-height:1.4;margin:10px 0 14px}
    .w{cursor:pointer;border-radius:4px}
    .w:hover{background:#dbeafe}
    .fr #tgt .c{cursor:pointer}
    .tag{display:inline-block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--blue);margin-right:8px}
    .opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:10px 14px;background:#fff;color:var(--text);border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--line);font:inherit;cursor:pointer}
    .opt:disabled{cursor:default}
    .opt.ok{background:#d7ffb8;border-color:var(--green)}
    .opt.bad{background:#ffdfe0;border-color:var(--red)}
    .btn{appearance:none;background:var(--green);color:#fff;border:0;padding:8px 18px;border-radius:14px;font:inherit;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;box-shadow:0 4px 0 var(--green-d)}
    .why{margin:12px 0 4px;padding:10px 14px;background:#fff7d6;border:2px solid #ffc800;border-radius:14px;font-size:.95rem;line-height:1.4}
    .why b{display:block;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#b58900;margin-bottom:2px}
    @keyframes in{from{opacity:0;transform:translateY(6px)}}
    @keyframes popIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6) rotate(-6deg)}35%{opacity:1;transform:translate(-50%,-52%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-64%) scale(1)}}
    @keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
    .card>*{animation:in .15s ease-out}
    .opt{transition:transform .08s,box-shadow .08s}
    .opt:not(:disabled):hover{transform:translateY(-1px);border-color:var(--blue)}
    .opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
    .opt .mk{float:right;font-weight:800}
    .face{font-size:1.4rem;margin-right:8px;vertical-align:middle}
    .fb{margin:10px 0 6px;font-weight:800;color:#58a700}
    .why b{display:flex;align-items:center;text-transform:none;letter-spacing:0;font-size:.85rem;color:#8a6a00}
    .why{animation:in .2s ease-out}
    .big-gg{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(40px,9vw,90px);font-weight:900;color:var(--green);text-shadow:0 4px 0 var(--green-d);opacity:0;pointer-events:none;z-index:80;animation:popIn .85s cubic-bezier(.22,.9,.18,1) forwards}
    .particle{position:fixed;left:50%;top:42%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:79;animation:fly .9s ease-out forwards}
    @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
    .tgt{font-size:1.05rem;line-height:1.5;margin:6px 0 10px}
    .tgt .c.done{color:#58a700}
    .tgt .c.cur{background:#ddf4ff;color:#1899d6;border-radius:4px}
    .blanks{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 8px;font-size:1.1rem;font-weight:800;letter-spacing:.03em}
    .blanks .word{display:inline-flex}
    .blanks .bl{min-width:.75em;text-align:center;border-bottom:3px solid var(--text);margin:0 1.5px;color:transparent}
    .blanks .bl.done{color:#58a700;border-bottom-color:var(--green)}
    .blanks .bl.cur{border-bottom-color:var(--blue)}
    .blanks .bl.bad{border-bottom-color:var(--red);background:#ffdfe0}
    #typer{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;font-size:.9rem;margin:2px 0 6px}
    #typer:focus{outline:none;border-color:var(--blue)}
    .progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:0 0 10px}
    .progress>span{display:block;height:100%;width:0;background:var(--green)}
    .artbox{background:#f4f8ff;border-left:4px solid #1cb0f6;border-radius:8px;padding:.7rem 1rem;margin:0 0 .8rem;max-height:60vh;overflow:auto}.art{margin:.3rem 0;line-height:1.7;font-size:1.05rem}.ah{margin:.8rem 0 .2rem;font-size:1rem;color:var(--muted)}.pas summary{cursor:pointer;font-weight:700}.pas p{margin:.3rem 0}
    .pas{background:#f4f8ff;border-left:4px solid #1cb0f6;border-radius:8px;padding:.6rem .8rem;margin:0 0 .8rem;line-height:1.55}.pas .src{display:block;font-size:.65rem;color:var(--muted);margin-top:.3rem}.credit{font-size:.65rem;color:var(--muted);margin:12px 2px 0;line-height:1.4}
    ul{padding-left:18px;margin:8px 0}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card"></div>
  <div id="status" role="status" aria-live="polite" style="position:absolute;left:-9999px"></div>
  <p class="credit">Questions: <a href="https://opentdb.com" target="_blank" rel="noopener">Open Trivia DB</a> (CC BY-SA 4.0) and the U.S. Department of Energy National Science Bowl practice rounds, plus beginner questions written with Gemini and fact-checked. Each day is the next 10 questions, easiest first.</p>
</div>
<script>
const PER_DAY = new URLSearchParams(location.search).get("cat") === "frlire" ? 1 : 10; // frlire: 1 full article (3 questions) a day
const NAMES = { geo: "Geography", chem: "Chemistry", life: "Life Science", phys: "Physics & Space", hist: "History & Society", fr: "Français", frlire: "Lecture" };
const cat = new URLSearchParams(location.search).get("cat");
const FR = cat === "fr" || cat === "frlire";
if (FR) { document.documentElement.lang = "fr"; document.body.classList.add("fr"); }

// French listening: every question is read aloud (stem, then the options); tap any word to hear it again.
const synth = FR && window.speechSynthesis;
let frVoice = null, slow = false, curText = "";
try { slow = localStorage.getItem("map-quiz-fr-slow") === "1"; } catch (e) { /* storage unavailable */ }
function pickVoice() { const vs = synth.getVoices(); frVoice = vs.find(v => /^fr[-_]ca$/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null; }
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
function speak(t) {
  if (!synth) return;
  const u = new SpeechSynthesisUtterance(t.replace(/_{2,}/g, " blanc ").replace(/[«»]/g, "").replace(/\s+/g, " ").trim());
  u.lang = frVoice ? frVoice.lang : "fr-FR"; if (frVoice) u.voice = frVoice;
  u.rate = slow ? 0.65 : 0.9;
  synth.speak(u);
}
// Spelling questions only read the stem: the options differ in spelling, not in sound.
function sayQuestion(q) { synth.cancel(); if (q.p && !q.full) speak(q.p); speak(q.q); if (!/orthograph|bien écrit|mal écrit/i.test(q.q)) q.a.forEach(speak); }
const stopSpeech = () => { if (synth) synth.cancel(); };
document.addEventListener("click", e => {
  if (!synth) return;
  const w = e.target.closest(".w");
  if (w) { synth.cancel(); speak(w.textContent); return; }
  const c = e.target.closest("#tgt .c");
  if (c) { // a letter of the sentence being typed: say the word it belongs to
    const n = +c.dataset.n, a = curText.lastIndexOf(" ", n) + 1, b = curText.indexOf(" ", n);
    const word = curText.slice(a, b < 0 ? curText.length : b);
    if (word.trim()) { synth.cancel(); speak(word); }
  }
});
const KEY = "map-quiz-trivia-" + cat;
const card = document.getElementById("card");
if (cat === "frlire") document.querySelector(".credit").innerHTML = 'Textes tirés de <a href="https://fr.vikidia.org" target="_blank" rel="noopener">Vikidia</a>, l’encyclopédie des 8-13 ans (CC BY-SA 3.0); questions écrites avec Gemini et vérifiées. Chaque jour, un texte entier.';
else if (FR) document.querySelector(".credit").innerHTML = 'Questions écrites avec Gemini et vérifiées; vocabulaire choisi parmi les mots les plus fréquents de <a href="https://github.com/hermitdave/FrequencyWords" target="_blank" rel="noopener">FrequencyWords</a> (CC BY-SA 4.0). Chaque jour, les 10 questions suivantes.';
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();

// state: { date, from, done } - done = score of today's set once finished.
// A new day moves on to the next 10 only if yesterday's set was finished.
function loadState() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* storage unavailable */ }
  if (!s) s = { date: today, from: 0, done: null };
  else if (s.date !== today) s = { date: today, from: s.done ? s.from + PER_DAY : s.from, done: null };
  return s;
}
function saveState(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ } }

// Mistakes notebook (kept locally): every wrong answer comes back after 1, 2, 4, 7, 15, 30 and 60 days.
// A right answer in a review moves it to the next interval (after the last one it is mastered and removed);
// a wrong answer sends it back to tomorrow.
const SRS_DAYS = [1, 2, 4, 7, 15, 30, 60];
const WKEY = "map-quiz-wrong-" + cat;
const dayPlus = n => { const d = new Date(); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function loadWrong() { try { return JSON.parse(localStorage.getItem(WKEY)) || {}; } catch (e) { return {}; } }
function saveWrong(w) { try { localStorage.setItem(WKEY, JSON.stringify(w)); } catch (e) { /* storage unavailable */ } }
function track(q, right) {
  if (practiceRun) return;
  const w = loadWrong(), k = q.p ? q.p.slice(0, 40) + "|" + q.q : q.q;
  if (reviewRun) {
    const r = w[k];
    if (!r) return;
    if (!right) { r.step = 0; r.due = dayPlus(SRS_DAYS[0]); }
    else if (++r.step >= SRS_DAYS.length) delete w[k];
    else r.due = dayPlus(SRS_DAYS[r.step]);
  } else if (!right) w[k] = { o: q, step: 0, due: dayPlus(SRS_DAYS[0]) };
  saveWrong(w);
}

let state, set, daily, bankTotal, i, correct, missed, practiceRun = false, reviewRun = false;
const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CORRECT_WORDS = FR ? ["Oui! Bravo!", "Bien joué!", "Exact!", "Tu connais ça!", "Très bien!", "Parfait!"] : ["Yes! Got it.", "Right!", "Nice one.", "You know it.", "Correct!", "Exactly."];
const say = t => { document.getElementById("status").textContent = t; };
// One big celebration, only for a perfect round; fly/fade (no strobing), skipped for reduced motion.
function celebrate(text) {
  if (calm) return;
  const fx = document.createElement("div"); fx.className = "big-gg"; fx.textContent = text;
  document.body.appendChild(fx); fx.addEventListener("animationend", () => fx.remove());
  const colors = ["#60a5fa", "#34d399", "#fbbf24", "#f472b6", "#a78bfa"];
  for (let n = 0; n < 22; n++) {
    const p = document.createElement("i"); p.className = "particle";
    p.style.setProperty("--dx", (Math.random() * 2 - 1) * 240 + "px");
    p.style.setProperty("--dy", (-Math.random() * 200 - 100) + "px");
    p.style.background = colors[n % colors.length];
    document.body.appendChild(p); p.addEventListener("animationend", () => p.remove());
  }
}

fetch(`data/trivia/${cat}.json`).then(r => r.json()).then(bank => {
  state = loadState();
  saveState(state);
  const today = bank.slice(state.from, state.from + PER_DAY);
  set = daily = cat === "frlire" ? today.flatMap(a => a.qs.map(q => ({ ...q, p: a.p, src: a.src, full: true }))) : today;
  bankTotal = bank.length;
  if (!set.length) { card.innerHTML = `<h1>${NAMES[cat]}</h1><p>You have finished the whole question bank (${bank.length} questions). 🎉</p>`; return; }
  state.done ? showDone() : showIntro(bank.length);
}).catch(() => { card.textContent = "Could not load questions."; });

function showIntro(total) {
  const levels = [...new Set(set.map(q => q.d))].join(" / ");
  card.innerHTML = `<h1>${NAMES[cat]} · ${cat === "frlire" ? "le texte du jour" : "Daily " + set.length}</h1>` +
    `<p class="meta">${cat === "frlire" ? "Texte " + (state.from + 1) + " sur " + total + " · lis, puis réponds à " + set.length + " questions · " + levels : "Questions " + (state.from + 1) + "–" + (state.from + set.length) + " of " + total + " · " + levels}</p>` +
    `<button class="btn" id="start">Start</button>` + reviewBlock();
  document.getElementById("start").onclick = () => start(false);
  bindReview();
}
function showDone() {
  card.innerHTML = `<h1>${NAMES[cat]} · Done for today ✓</h1><p class="meta">Score ${state.done.correct} / ${state.done.total}. ${cat === "frlire" ? "Reviens demain pour un nouveau texte." : "Come back tomorrow for the next " + PER_DAY + "."}</p>` +
    `<button class="btn" id="again">Practice again</button>` + reviewBlock();
  document.getElementById("again").onclick = () => start(true);
  bindReview();
}
// The mistakes notebook under the buttons: how many are saved, how many are due, and a list of them all.
function reviewBlock() {
  const w = Object.values(loadWrong());
  if (!w.length) return "";
  const due = w.filter(r => r.due <= today).length;
  const next = w.map(r => r.due).sort()[0];
  return `<div class="rv"><p class="meta">Mistakes saved: ${w.length} · ${due ? due + " to review today" : "next review " + next}</p>` +
    (due ? `<button class="btn" id="review">Review mistakes (${Math.min(due, PER_DAY)})</button>` : "") +
    `<details><summary class="meta">See all mistakes</summary><ul>${w.map(r => `<li>${esc(r.o.q)} <b>${esc(r.o.a[r.o.c])}</b></li>`).join("")}</ul></details></div>`;
}
function bindReview() {
  const b = document.getElementById("review");
  if (b) b.onclick = () => { set = Object.values(loadWrong()).filter(r => r.due <= today).sort((a, b) => a.due.localeCompare(b.due)).slice(0, PER_DAY).map(r => r.o); reviewRun = true; practiceRun = false; i = 0; correct = 0; missed = []; show(); };
}
function start(practice) {
  set = daily; reviewRun = false;
  i = 0; correct = 0; missed = []; practiceRun = practice;
  cat === "frlire" ? showReading() : show();
}
// frlire: the whole article first (tap a word to hear it, or listen to all of it), then the questions.
function showReading() {
  const a = set[0];
  const body = a.p.split("\n").map(l => /^[^.!?:«»]{2,40}$/.test(l) && l.split(" ").length < 7 ? `<h3 class="ah">${esc(l)}</h3>` : `<p class="art">${words(l)}</p>`).join("");
  card.innerHTML = `<h1>${esc(a.src)}</h1><div class="artbox">${body}</div>` +
    `<p class="credit" style="margin:0 0 .6rem"><a href="https://fr.vikidia.org/wiki/${encodeURIComponent(a.src.replace(/ /g, "_"))}" target="_blank" rel="noopener">Vikidia · ${esc(a.src)}</a> (CC BY-SA 3.0)</p>` +
    (synth ? `<button class="btn" id="hearAll" style="margin-right:.5rem">🔊 Écouter</button>` : "") + `<button class="btn" id="readGo">J'ai lu — les questions</button>`;
  if (synth) document.getElementById("hearAll").onclick = () => { synth.cancel(); a.p.split("\n").forEach(speak); };
  document.getElementById("readGo").onclick = () => { stopSpeech(); show(); };
}
function show() {
  const q = set[i];
  card.innerHTML = `<div class="progress"><span style="width:${100 * i / set.length}%"></span></div>` +
    `<p class="meta"><span class="tag">${q.d}</span>${i + 1} / ${set.length}</p>${q.full ? `<details class="pas"><summary>📖 Relire le texte</summary>${q.p.split("\n").map(l => `<p>${esc(l)}</p>`).join("")}</details>` : q.p ? `<p class="pas">${synth ? words(q.p) : esc(q.p)} <a class="src" href="https://fr.vikidia.org/wiki/${encodeURIComponent(q.src.replace(/ /g, "_"))}" target="_blank" rel="noopener">Vikidia · ${esc(q.src)}</a></p>` : ""}<p class="q">${synth ? words(q.q) : esc(q.q)}</p>` +
    q.a.map((t, k) => `<button class="opt" data-k="${k}">${esc(t)}</button>`).join("") + `<div id="after"></div>`;
  card.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  if (synth) {
    const mk = (label, fn) => { const b = document.createElement("button"); b.className = "btn"; b.style.cssText = "margin:0 .5rem .6rem 0;padding:.3rem .8rem;font-size:.85rem"; b.textContent = label; b.onclick = fn; return b; };
    const slowLabel = () => "🐢 Lent : " + (slow ? "oui" : "non");
    const slowBtn = mk(slowLabel(), () => {
      slow = !slow; slowBtn.textContent = slowLabel();
      try { localStorage.setItem("map-quiz-fr-slow", slow ? "1" : ""); } catch (e) { /* storage unavailable */ }
      sayQuestion(q);
    });
    card.querySelector(".q").after(mk("🔊 Écouter", () => sayQuestion(q)), slowBtn);
    sayQuestion(q);
  }
}
// Every word of a French question is a tap target that reads that word aloud.
const words = t => esc(t).replace(/\S+/g, w => /[a-zà-ÿ]/i.test(w) && !w.startsWith("_") ? `<span class="w">${w}</span>` : w);
function answer(k) {
  const q = set[i];
  const isRight = k === q.c;
  stopSpeech();
  track(q, isRight);
  card.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const bk = +b.dataset.k;
    if (bk === q.c) { b.classList.add("ok"); b.insertAdjacentHTML("beforeend", '<span class="mk" aria-hidden="true">✓</span>'); }
    else if (bk === k) { b.classList.add("bad"); b.insertAdjacentHTML("beforeend", '<span class="mk" aria-hidden="true">✗</span>'); }
  });
  if (isRight) {
    correct++;
    if (!calm) card.querySelector(".opt.ok").animate([{ transform: "scale(1)" }, { transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 300 });
  } else missed.push(q);
  const last = i === set.length - 1;
  const word = CORRECT_WORDS[Math.floor(Math.random() * CORRECT_WORDS.length)];
  say(isRight ? "Correct" : "Not this time. The answer is " + q.a[q.c]);
  const after = document.getElementById("after");
  const goNext = () => { i++; last ? finish() : show(); };
  const nextBtn = `<button class="btn" id="next">${last ? "Finish" : "Next"}</button>`;
  if (isRight) {
    after.innerHTML = `<div class="fb"><span class="face" aria-hidden="true">😄</span>${word}</div>` +
      `<div class="why"><b>✓ ${esc(q.a[q.c])}</b>${q.e ? esc(q.e) : ""}</div>` + nextBtn;
    document.getElementById("next").onclick = goNext;
    return;
  }
  // Wrong answer: read the explanation, then type it out (same way as the Typing riddles) before moving on.
  const head = `<b><span class="face" aria-hidden="true">🤔</span>Not this time, here's the cool part</b>`;
  if (!q.e) { after.innerHTML = `<div class="why">${head}The answer is ${esc(q.a[q.c])}.</div>` + nextBtn; document.getElementById("next").onclick = goNext; return; }
  if (!reviewRun) {
    // First time wrong: just read the explanation (out loud, or with the listen button). Typing it is only for a miss in the mistakes review.
    const hear = () => { if (FR) { synth && (synth.cancel(), speak(q.e)); } else if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(q.e); u.lang = "en-US"; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } };
    after.innerHTML = `<div class="why">${head}${synth ? words(q.e) : esc(q.e)}<small style="display:block;margin-top:.4rem;color:var(--muted)">${FR ? "Lis-le à voix haute." : "Read it out loud."}</small></div>` +
      `<button class="btn" id="hearE" style="margin-right:.5rem">🔊 ${FR ? "Écouter" : "Listen"}</button>` + nextBtn;
    document.getElementById("hearE").onclick = hear;
    document.getElementById("next").onclick = goNext;
    return;
  }
  after.innerHTML = `<div class="why">${head}<div class="tgt" id="tgt"></div><div class="blanks" id="blanks"></div></div>` +
    `<input id="typer" type="text" placeholder="Type the sentence above to continue…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the explanation">`;
  speak(q.e);
  typeOut(q.e, () => {
    say("Well done. Press Next to continue.");
    document.getElementById("typer").remove();
    after.insertAdjacentHTML("beforeend", nextBtn);
    document.getElementById("next").onclick = goNext;
    document.getElementById("next").focus();
  });
}

// Type-out step: letters and spaces are typed, punctuation and digits are filled in; a wrong key just flashes red.
// French: accented letters count as typed letters; typing the plain letter (e for é) is accepted, œ and æ are filled in.
const isTyped = ch => /[a-zà-ÿ]/i.test(ch) || ch === " ";
const fold = ch => ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function typeOut(text, onDone) {
  let idx = 0;
  curText = text;
  const tgt =document.getElementById("tgt"), blanks = document.getElementById("blanks"), typer = document.getElementById("typer");
  const skip = () => { while (idx < text.length && !isTyped(text[idx])) idx++; };
  function paint(wrongAt) {
    tgt.innerHTML = ""; blanks.innerHTML = "";
    let word = null;
    [...text].forEach((ch, n) => {
      const c = document.createElement("span"); c.className = "c" + (n < idx ? " done" : n === idx ? " cur" : ""); c.textContent = ch; c.dataset.n = n; tgt.appendChild(c);
      if (ch === " ") { word = null; return; }
      if (!word) { word = document.createElement("span"); word.className = "word"; blanks.appendChild(word); }
      const s = document.createElement("span");
      s.className = isTyped(ch) ? "bl" + (n < idx ? " done" : "") + (n === idx ? " cur" : "") + (n === wrongAt ? " bad" : "") : "au";
      s.textContent = ch; word.appendChild(s);
    });
  }
  skip(); paint(); typer.focus();
  const press = ch => {
    if (idx >= text.length) return;
    if (fold(text[idx]) === fold(ch)) {
      idx++; skip(); paint();
      if (idx >= text.length) onDone();
    } else { paint(idx); setTimeout(() => paint(), 250); }
  };
  typer.addEventListener("keydown", e => {
    if (e.key.length !== 1 || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    press(e.key);
  });
  // Phone keyboards often report key "Unidentified"; their letters arrive as input events instead.
  typer.addEventListener("input", () => { const v = typer.value; typer.value = ""; for (const ch of v) press(ch); });
}
function finish() {
  if (!practiceRun) {
    if (!reviewRun) { state.done = { correct, total: set.length }; saveState(state); }
    try { parent.postMessage({ type: reviewRun ? "trivia-review" : "trivia-result", cat, name: NAMES[cat], correct, total: set.length }, location.origin); } catch (e) { /* standalone */ }
  }
  const n = set.length, perfect = missed.length === 0;
  const [face, headline] = perfect ? ["🤩", "Perfect!"]
    : correct * 2 >= n ? ["😊", `${correct} / ${n}, nice work!`]
    : ["💪", `You learned ${missed.length} new thing${missed.length === 1 ? "" : "s"} today!`];
  if (perfect) celebrate("Perfect!");
  say(perfect ? "Perfect score" : headline);
  card.innerHTML = `<h1><span class="face" aria-hidden="true">${face}</span>${headline}</h1><p class="meta">${correct} / ${n} correct</p>` +
    (missed.length ? `<p class="meta">Review these:</p><ul>${missed.map(q => `<li>${esc(q.q)} <b>${esc(q.a[q.c])}</b>${q.e ? `<br><small>${esc(q.e)}</small>` : ""}</li>`).join("")}</ul>` : "") +
    `<button class="btn" id="done">OK</button>`;
  document.getElementById("done").onclick = () => { set = daily; reviewRun = false; state.done ? showDone() : showIntro(bankTotal); };
}
</script>
</body>
